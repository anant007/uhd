# General parameters
# -----------------------------------------
schema: rfnoc_imagebuilder_args         # Identifier for the schema used to validate this file
copyright: >-                           # Copyright information used in file headers
  Copyright 2023 Ettus Research, a National Instruments Brand
license: >-                             # License information used in file headers
  SPDX-License-Identifier: LGPL-3.0-or-later
version: '1.0'                          # File version
chdr_width: 64                          # Bit width of the CHDR bus for this image

# A list of all stream endpoints in design
# ----------------------------------------
stream_endpoints:    
  epddc0:               # Stream endpoint name
    buff_size: 0        # Endpoint passes control traffic
    ctrl: True          # Endpoint passes data traffic
    data: True          # Ingress buffer size for data
  epddc1:                            
    buff_size: 0
    ctrl: False
    data: True
  epddc2:
    buff_size: 0
    ctrl: False
    data: True
  epddc3:
    buff_size: 0
    ctrl: False
    data: True
  eprx0:
    buff_size: 0
    ctrl: True
    data: True
  eprx1:
    buff_size: 0
    ctrl: False
    data: True
  eprx2:
    buff_size: 0
    ctrl: False
    data: True
  eprx3:
    buff_size: 0
    ctrl: False
    data: True

# A list of all NoC blocks in design
# ----------------------------------
noc_blocks:
  ddc0:
    block_desc: 'ddc.yml'
    parameters:
      NUM_PORTS: 4
  radio0:
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
  radio1:
    block_desc: 'radio.yml'
    parameters:
      NUM_PORTS: 2
  switchsplit:
    block_desc: 'split_stream.yml'
    parameters:
      NUM_PORTS: 1
      NUM_BRANCHES: 4
    priority: 98
  rxswitch:
    block_desc: 'switchboard.yml'
    parameters:
      NUM_INPUTS: 1
      NUM_OUTPUTS: 2
    priority: 97

# A list of all static connections in design
# ------------------------------------------
# Format: A list of connection maps (list of key-value pairs) with the following keys
#   - srcblk  = Source block to connect
#   - srcport = Port on the source block to connect
#   - dstblk  = Destination block to connect
#   - dstport = Port on the destination block to connect
connections:
  # TX ports are connected to DDC endpoints allowing to be accessed by host
  - { srcblk: epddc0,  srcport: out0, dstblk: radio0, dstport: in_0 }
  - { srcblk: epddc1,  srcport: out0, dstblk: radio0, dstport: in_1 }
  - { srcblk: epddc2,  srcport: out0, dstblk: radio1, dstport: in_0 }
  - { srcblk: epddc3,  srcport: out0, dstblk: radio1, dstport: in_1 }
  # - { srcblk: radio0, srcport: out_0, dstblk: switchsplit,   dstport: in_0  }
  - { srcblk: radio1, srcport: out_0, dstblk: switchin,  dstport: in_5  }
  - { srcblk: radio1, srcport: out_1, dstblk: switchin,  dstport: in_6  }
  - { srcblk: radio0, srcport: out_1, dstblk: switchin,  dstport: in_7  }
  # Connecting all the RX ports to be routed thorugh rxswitch
  - { srcblk: radio0, srcport: out_0, dstblk: rxswitch,   dstport: in_0  }
  # - { srcblk: radio0, srcport: out_1, dstblk: rxswitch,  dstport: in_1  }
  # - { srcblk: radio1, srcport: out_0, dstblk: rxswitch,  dstport: in_2  }
  # - { srcblk: radio1, srcport: out_1, dstblk: rxswitch,  dstport: in_3  }

  - { srcblk: rxswitch, srcport: out_0, dstblk: switchsplit,   dstport: in_0  }
  - { srcblk: rxswitch, srcport: out_1, dstblk: switchin,  dstport: in_4  }


  # Splitter output connected to switchboard inputs
  - { srcblk: switchsplit,      srcport: out_0, dstblk: switchin,  dstport: in_0   }
  - { srcblk: switchsplit,      srcport: out_1, dstblk: switchin,  dstport: in_1   }
  - { srcblk: switchsplit,      srcport: out_2, dstblk: switchin,  dstport: in_2   }
  - { srcblk: switchsplit,      srcport: out_3, dstblk: switchin,  dstport: in_3   }
  # - { srcblk: eprx0, srcport: out1, dstblk: _device_,   dstport: _none_ }

  - { srcblk: switchin, srcport: out_0,  dstblk: ddc0,    dstport: in_0 }
  - { srcblk: switchin, srcport: out_1,  dstblk: ddc0,    dstport: in_1 }
  - { srcblk: switchin, srcport: out_2,  dstblk: ddc0,    dstport: in_2 }
  - { srcblk: switchin, srcport: out_3,  dstblk: ddc0,    dstport: in_3 }


  - { srcblk: ddc0,  srcport: out_0,  dstblk: epddc0,  dstport: in0  }
  - { srcblk: ddc0,  srcport: out_1,  dstblk: epddc1,  dstport: in0  }
  - { srcblk: ddc0,  srcport: out_2,  dstblk: epddc2,  dstport: in0  }
  - { srcblk: ddc0,  srcport: out_3,  dstblk: epddc3,  dstport: in0  }
  # - { srcblk: ddc0,   srcport: out_0, dstblk: epddc0, dstport: in0  }
  # RF A RX2
  # - { srcblk: eprx1, srcport: out1, dstblk: _device_,   dstport: _none_ }
  # - { srcblk: ddc0,   srcport: out_1, dstblk: epddc1,  dstport: in0  }
  #
  # RF B TX

  # See comment above about fake connections.
  
  # RF B RX
  # - { srcblk: eprx2, srcport: out1, dstblk: _device_,   dstport: _none_ }
  # - { srcblk: ddc0,   srcport: out_2, dstblk: epddc2, dstport: in0  }
  # RF B RX2
  # - { srcblk: eprx3, srcport: out1, dstblk: _device_,   dstport: _none_ }
  # - { srcblk: ddc0,   srcport: out_3, dstblk: epddc3,  dstport: in0  }
  #
  # BSP Connections
  - { srcblk: radio0,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio0 }
  - { srcblk: _device_, srcport: radio0,   dstblk: radio0,   dstport: radio           }
  - { srcblk: _device_, srcport: time,     dstblk: radio0,   dstport: time            }

  - { srcblk: radio1,   srcport: ctrlport, dstblk: _device_, dstport: ctrlport_radio1 }
  - { srcblk: _device_, srcport: radio1,   dstblk: radio1,   dstport: radio           }
  - { srcblk: _device_, srcport: time,     dstblk: radio1,   dstport: time            }

# A list of all clock domain connections in design
# ------------------------------------------------
# Format: A list of connection maps (list of key-value pairs) with the following keys
#   - srcblk  = Source block to connect (Always "_device"_)
#   - srcport = Clock domain on the source block to connect
#   - dstblk  = Destination block to connect
#   - dstport = Clock domain on the destination block to connect
clk_domains:
    - { srcblk: _device_, srcport: radio, dstblk: radio0, dstport: radio }
    - { srcblk: _device_, srcport: radio, dstblk: radio1, dstport: radio }
    - { srcblk: _device_, srcport: ce,    dstblk: ddc0,   dstport: ce    }

