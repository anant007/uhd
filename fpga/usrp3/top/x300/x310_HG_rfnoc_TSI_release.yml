# General parameters
# -----------------------------------------
schema: rfnoc_imagebuilder_args         # Identifier for the schema used to validate this file
copyright: >-                           # Copyright information used in file headers
  Copyright 2023 Ettus Research, a National Instruments Brand
license: >-                             # License information used in file headers
  SPDX-License-Identifier: LGPL-3.0-or-later
version: '1.0'                          # File version
chdr_width: 64                          # Bit width of the CHDR bus for this image
device: 'x310'
image_core_name: 'usrp_x310_HG_rfnoc_TSI_release'  # This is used for the bitfile, DTS, and report
default_target: 'X310_HG'
inherit:
  - 'yaml_include/x3xx_radio_base_rel.yml'

# A list of all stream endpoints in design
# ----------------------------------------
stream_endpoints:
  eprx0:
    buff_size: 0                    # Ingress buffer size for data
  eprx1:
    buff_size: 0                    # Ingress buffer size for data
  eprx2:
    buff_size: 0
  eprx3:
    buff_size: 0
  epddc0:                                  # Stream endpoint name
    buff_size: 0                    # Ingress buffer size for data
  epddc1:                              #DDC1 is supposed to be the MUXED RF signal input
    buff_size: 0
  epddc2:
    buff_size: 0
  epddc3: 
    buff_size: 0

  epoutswitchrx:
    buff_size: 0 
    ctrl: True
    data: True

  epswitchin0:
    buff_size: 0 
    ctrl: True
    data: True

  eprxsplit0:
    buff_size: 0
    ctrl: True
    data: True
  eprxsplit1:
    buff_size: 0
    ctrl: False
    data: True
  eprxsplit2:
    buff_size: 0
    ctrl: False
    data: True
  eprxsplit3:
    buff_size: 0
    ctrl: False
    data: True

  epfir0:
    buff_size: 0
    ctrl: True
    data: True
  epfir1:
    buff_size: 0
    ctrl: False
    data: True
  epfir2:
    buff_size: 0
    ctrl: False
    data: True
  epfir3:
    buff_size: 0
    ctrl: False
    data: True

  

# A list of all NoC blocks in design
# ----------------------------------
noc_blocks:
  switchin:
    block_desc: 'switchboard.yml'
    parameters:
      NUM_INPUTS: 1
      NUM_OUTPUTS: 2
    priority: 99
  rxsplit:
    block_desc: 'split_stream.yml'
    parameters:
      NUM_PORTS: 1
      NUM_BRANCHES: 4
    priority: 99
  fir0:
    block_desc: 'fir_filter.yml'
    parameters:
      NUM_PORTS: 4
      NUM_COEFFS: 183
      SYMMETRIC_COEFFS: 1
    priority: 99

# A list of all static connections in design
# ------------------------------------------
# Format: A list of connection maps (list of key-value pairs) with the following keys
#   - srcblk  = Source block to connect
#   - srcport = Port on the source block to connect
#   - dstblk  = Destination block to connect
#   - dstport = Port on the destination block to connect
connections:
  # Incoming Connections to blocks
  # Block to Block Connections below

  ## SEP Connections Below
  - { srcblk: eprx0,        srcport: out0,   dstblk: _device_,   dstport: _none_ } #dstblk: switchin,   dstport: in_0   }
  - { srcblk: eprx1,        srcport: out0,   dstblk: _device_,   dstport: _none_   }
  - { srcblk: eprx2,        srcport: out0,   dstblk: _device_,   dstport: _none_   }
  - { srcblk: eprx3,        srcport: out0,   dstblk: _device_,   dstport: _none_   }

  # Input RX0 stream switch connections
  - { srcblk: epswitchin0,  srcport: out0,    dstblk: switchin,         dstport: in_0   }
  - { srcblk: switchin,       srcport: out_0,  dstblk: epswitchin0,   dstport: in0   }

  - { srcblk: switchin,       srcport: out_1,  dstblk: rxsplit,   dstport: in_0   }  

  # - { srcblk: epoutswitchrx,  srcport: out0,  dstblk: switchout,    dstport: in_0   }

  - { srcblk: rxsplit,      srcport: out_0,  dstblk: eprxsplit0,  dstport: in0    }
  - { srcblk: rxsplit,      srcport: out_1,  dstblk: eprxsplit1,  dstport: in0    }
  - { srcblk: rxsplit,      srcport: out_2,  dstblk: eprxsplit2,  dstport: in0    }
  - { srcblk: rxsplit,      srcport: out_3,  dstblk: eprxsplit3,  dstport: in0    }
  - { srcblk: eprxsplit0,   srcport: out0,   dstblk: _device_,    dstport: _none_ }
  - { srcblk: eprxsplit1,   srcport: out0,   dstblk: _device_,    dstport: _none_ }
  - { srcblk: eprxsplit2,   srcport: out0,   dstblk: _device_,    dstport: _none_ }
  - { srcblk: eprxsplit3,   srcport: out0,   dstblk: _device_,    dstport: _none_ }
  
  # FIR Filter connections
  - { srcblk: fir0,    srcport: out_0, dstblk: epfir0,  dstport: in0  }
  - { srcblk: fir0,    srcport: out_1, dstblk: epfir1,  dstport: in0  }
  - { srcblk: fir0,    srcport: out_2, dstblk: epfir2,  dstport: in0  }
  - { srcblk: fir0,    srcport: out_3, dstblk: epfir3,  dstport: in0  }
  - { srcblk: epfir0,   srcport: out0,   dstblk: fir0,   dstport: in_0 }
  - { srcblk: epfir1,   srcport: out0,   dstblk: fir0,   dstport: in_1 }
  - { srcblk: epfir2,   srcport: out0,   dstblk: fir0,   dstport: in_2 }
  - { srcblk: epfir3,   srcport: out0,   dstblk: fir0,   dstport: in_3 } 



  #
  # BSP Connections


# A list of all clock domain connections in design
# ------------------------------------------------
# Format: A list of connection maps (list of key-value pairs) with the following keys
#   - srcblk  = Source block to connect (Always "_device"_)
#   - srcport = Clock domain on the source block to connect
#   - dstblk  = Destination block to connect
#   - dstport = Clock domain on the destination block to connect
clk_domains:
  - { srcblk: _device_, srcport: ce,    dstblk: fir0,      dstport: ce  }


