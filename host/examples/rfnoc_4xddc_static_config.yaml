    connections:
      - src: "0/Radio#0:0"
        dst: "0/DDC#0:0"
      - src: "0/Radio#0:1"
        dst: "0/DDC#0:1"
      - src: "0/Radio#1:0"
        dst: "0/DDC#0:2"
      - src: "0/Radio#1:1"
        dst: "0/DDC#0:3"

# Note: These override command-line options
tsi_format:
  enabled: true
  sat_id: 42
  include_file_header: false    # No magic number header
  csv_max_packets: 1024        # Write first 1000 packets to CSV for verification
  csv_samples_per_packet: 4

pps_reset:
