  commit_after_each_connection: false
  discover_static_connections: true
  preserve_static_routes: true
  block_init_order:
    - "0/Radio#0"
    - "0/Radio#1"
    - "0/SplitStream#0"
    - "0/DDC#0"
    - "0/FIR#0"
    - "0/FIR#1"
    - "0/FIR#2"
    - "0/FIR#3"
    

