# Multi-stream configuration (multiple streaming endpoints detected)
multi_stream:
  enable: true
  sync_streams: true
  separate_files: true
  # file_prefix: "stream"
  max_streams: 2
  sync_delay: 0.5
  sat-id: 430
  use_tsi_format: true
  stream_blocks:
    - "0/DDC#0"  # Port 0
    - "0/DDC#0"  # Port 1
    # - "0/DDC#0"  # Port 2
    # - "0/DDC#0"  # Port 3

# Static connections (hardcoded in FPGA image)
# These connections cannot be changed at runtime
static_connections:


# Dynamic block connections
# Add/modify connections as needed for your application
connections:

  # Example connections for available ports:
  # 0/AddSub#0:0 (output) is available
  




# Stream endpoint configuration
# sample_processing_mode options:
#   - "fgb": Polyphase Quadrature Demodulation (fs/4 shift, 2x decimation)
#            Takes 4 samples -> 2 samples, shifts center freq by +fs/4
#   - "sgb": Decimation with averaging filter (2x decimation)
#            Takes 2 samples -> 1 sample with improved SNR
#   - (omit or empty): No processing, pass-through raw samples
stream_endpoints:
  - block_id: "0/DDC#0"
    port: 0
    direction: "rx"
    enabled: true
    name: "Stream_0"
    stream_args:
      spp: "1024"
    tsi_config:
      enabled: true
      sat_id: 430
      tuning_freq_hz: 406000000    # 406 MHz SARSAT frequency
      include_file_header: false
      sample_processing_mode: "sgb"  # First Gen Beacon polyphase processing
      csv_max_packets: 1000
      csv_samples_per_packet: 4
  # - block_id: "0/DDC#0"
  #   port: 0
  #   direction: "rx"
  #   enabled: true
  #   name: "Stream_0"
  #   sample_processing_mode: "fgb"  # Apply decimation with averaging
  #   stream_args:
  #     spp: "1024"
  - block_id: "0/DDC#0"
    port: 1
    direction: "rx"
    enabled: true
    name: "SARSAT_FGB_Stream"
    stream_args:
      spp: "1024"
    tsi_config:
      enabled: true
      sat_id: 430
      tuning_freq_hz: 406000000    # 406 MHz SARSAT frequency
      include_file_header: false
      sample_processing_mode: "fgb"  # First Gen Beacon polyphase processing
      csv_max_packets: 1000
      csv_samples_per_packet: 4
    socket:
      enabled: true
      mode: "server"
      host: "127.0.0.1"
      port: 5001
      nonblocking: true
      drop_on_full: true
      connect_timeout_ms: 150000


